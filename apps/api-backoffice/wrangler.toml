name = "loanms-api-backoffice"
main = "src/core/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ['nodejs_compat']
upload_source_maps = true

##########
# Global #
##########

[observability]
enabled = true

[limits]
cpu_ms = 5000

[placement]
mode = "smart"
# https://developers.cloudflare.com/workers/configuration/placement/#provide-placement-hints
# region = "aws:ap-southeast-1"

[triggers]
crons = ["*/5 * * * *", "0 19 * * *", "5 * * * *", "10 * * * *", "15 * * * *"]

[exports.RateLimit]
type = "durable-object"
storage = "sqlite"

[exports.WebSocketBroker]
type = "durable-object"
storage = "sqlite"

[exports.WebSocketServer]
type = "durable-object"
storage = "sqlite"

[exports.RealtimePublisher]
type = "worker"

[exports.RealtimeRevocationBroker]
type = "worker"

[build]
# Used only to generate build artifacts used in project references
command = "tsc --build ./tsconfig.build.json"
watch_dir = [
    "./src/",
    "../../packages/errors/src/",
    "../../packages/types/src/",
    "../../packages/validator/src/",
    "../../packages/database/src/",
    "../../packages/rate-limit/src/",
    "../../packages/websocket/src/",
]

[dev]
port = 8080

########################
# DEV (no environment) #
########################

[vars]
ENVIRONMENT = "development"
STATUS = "up"
CF_R2_BUCKET_PRIVATE = "loanms-development-prv"
CF_R2_BUCKET_PUBLIC = "loanms-development-pub"
CF_R2_BUCKET_PUBLIC_URL = "https://loanms-dev.r2.loanms.example"
CF_R2_PRESIGN_EXPIRY = 300 # 5 minutes (seconds)
CF_TURNSTILE_BYPASS = 1 # (0|1)
CF_TURNSTILE_SITE_VERIFY = "https://challenges.cloudflare.com/turnstile/v0/siteverify"
CF_TURNSTILE_SITE_VERIFY_TIMEOUT_MS = 5000
CF_TURNSTILE_TOKEN_MAX_LENGTH = 2048
CORS_ALLOW_CREDENTIALS = 1 # (0|1)
CORS_ALLOW_HEADERS = "Content-Type,User-Agent,X-CAPTCHA-Response,X-CSRF-Token"
CORS_ALLOW_METHODS = "GET,POST,QUERY"
CORS_EXPOSE_HEADERS = "Content-Length"
CORS_MAX_AGE = 7200 # 2 hours (seconds)
FEATURE_API_KEY = 0
FEATURE_MAIL = 0
FEATURE_OBJECT_STORAGE = 0 # Configure R2 variables and secrets before enabling.
SESSION_EXPIRATION = 604800 # 7 days (seconds)
SESSION_UPDATE_AGE = 86400 # 1 day (seconds)
URL_BACKEND = "http://localhost:8080"
URL_FRONTEND = "http://localhost:5173"

[[kv_namespaces]]
binding = "LOANMSBOFC_KV"
id = "00000000000000000000000000000000"

[[d1_databases]]
binding = "LOANMSBOFC_D1"
database_name = "loanms-development"
database_id = "00000000-0000-0000-0000-000000000000"

[[durable_objects.bindings]]
name = "LOANMSBOFC_DO_RL"
class_name = "RateLimit"

[[durable_objects.bindings]]
name = "LOANMSBOFC_DO_WSB"
class_name = "WebSocketBroker"

[[durable_objects.bindings]]
name = "LOANMSBOFC_DO_WSS"
class_name = "WebSocketServer"

########
# TEST #
########

[env.test]
workers_dev = false
preview_urls = false
route = { zone_name = "", pattern = "" }
#route = { custom_domain = true, pattern = "" }

[env.test.vars]
ENVIRONMENT = "test"
STATUS = "up"
CF_R2_BUCKET_PRIVATE = "loanms-test-prv"
CF_R2_BUCKET_PUBLIC = "loanms-test-pub"
CF_R2_BUCKET_PUBLIC_URL = "https://loanms-test.r2.loanms.example"
CF_R2_PRESIGN_EXPIRY = 300 # 5 minutes (seconds)
CF_TURNSTILE_BYPASS = 1 # (0|1)
CF_TURNSTILE_SITE_VERIFY = "https://challenges.cloudflare.com/turnstile/v0/siteverify"
CF_TURNSTILE_SITE_VERIFY_TIMEOUT_MS = 5000
CF_TURNSTILE_TOKEN_MAX_LENGTH = 2048
CORS_ALLOW_CREDENTIALS = 1 # (0|1)
CORS_ALLOW_HEADERS = "Content-Type,User-Agent,X-CAPTCHA-Response,X-CSRF-Token"
CORS_ALLOW_METHODS = "GET,POST,QUERY"
CORS_EXPOSE_HEADERS = "Content-Length"
CORS_MAX_AGE = 7200 # 2 hours (seconds)
FEATURE_API_KEY = 1 # Keep regression coverage enabled in tests.
FEATURE_MAIL = 1 # Keep regression coverage enabled in tests.
FEATURE_OBJECT_STORAGE = 1 # Keep regression coverage enabled in tests.
MAILER_ACCOUNT = "no-reply@loanms.app"
MAILER_PROVIDER = "cloudflare"
SESSION_EXPIRATION = 604800 # 7 days (seconds)
SESSION_UPDATE_AGE = 86400 # 1 day (seconds)
URL_BACKEND = "http://localhost:8080"
URL_FRONTEND = "http://localhost:5173"

[[env.test.send_email]]
name = "LOANMSBOFC_EMAIL"
allowed_sender_addresses = ["no-reply@loanms.app"]

[[env.test.kv_namespaces]]
binding = "LOANMSBOFC_KV"
id = "00000000000000000000000000000001"

[[env.test.d1_databases]]
binding = "LOANMSBOFC_D1"
database_name = "loanms-test"
database_id = "00000000-0000-0000-0000-000000000001"

[[env.test.durable_objects.bindings]]
name = "LOANMSBOFC_DO_RL"
class_name = "RateLimit"

[[env.test.durable_objects.bindings]]
name = "LOANMSBOFC_DO_WSB"
class_name = "WebSocketBroker"

[[env.test.durable_objects.bindings]]
name = "LOANMSBOFC_DO_WSS"
class_name = "WebSocketServer"
